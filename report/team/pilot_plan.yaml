# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0,70, 0,75))
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 3.103 yêu cầu/nhóm -> cần 42 NV/nhóm (84 > 40 NV hiện có: không đủ người)
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 6 / 0,02 = 300 < 1.251 (loại vì thiếu mẫu và dưới 20 cụm/nhóm)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1) * 0,02) >= 859 -> m >= 299 yêu cầu mỗi nhân viên (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng xử lý song song trong cùng các tuần và cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed cố định ghi trước, phân tầng theo depot để cân bằng đặc thù từng kho.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên trao đổi câu trả lời trong cùng depot; giảm bằng phân quyền truy cập trợ lý theo tài khoản staff_id và ghi log mọi lượt mở gợi ý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt toàn bộ chỉ số chính, MDE 0,06, luật dừng và decision_date trong file này trước ngày chạy pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) cho mỗi nhóm can thiệp và đối chứng.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên hiện có, không cách chia theo cụm nào đủ mẫu phát hiện mức chênh +5 điểm. Nhóm chọn chia ngẫu nhiên theo nhân viên (20 + 20) để tách được tác động (tránh tràn tác động khi chia theo yêu cầu) và chấp nhận nâng MDE lên +6 điểm (n_per_arm = 859, m >= 299 yêu cầu/nhân viên, DE = 6,96). Đánh đổi bất lợi: nếu tác động thật chỉ là +5 điểm, power thực tế giảm còn ~0,64 (NormalIndPower).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 4,25% (51/1.200) trên toàn mẫu và 3,97% (39/982) trong phạm vi noi_dia + hang_nang. Vì nền đã gần 4%, không đặt ngưỡng dừng cứng 3% (sẽ làm dừng ngay tuần đầu); thay bằng so sánh trực tiếp với nhóm đối chứng (cao hơn >= 2 điểm phần trăm) kèm trần tuyệt đối 6% và 0 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên toàn bộ 12 depot; loại quoc_te (22.515 đ = 1,88x, thành công 27,3%, simulated) và doi_tac (10.215 đ = 0,85x, có điều khoản riêng, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên (mỗi bước 1 tuần); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
