    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên nhóm đối chứng xử lý song song trong cùng các tuần và cùng 12 depot với 20 nhân viên nhóm trợ lý"
    spillover_risk: "Trung bình do nhân viên dùng và không dùng làm cùng depot; giảm thiểu bằng cấp quyền truy cập trợ lý theo tài khoản staff_id riêng, không cho dùng chung tài khoản và đối soát log agent_suggestion_shown theo staff_id hằng tuần"
    predeclared: "Có: chỉ số chính, MDE 0,06, cỡ mẫu n_per_arm = 859 (m >= 299 yc/NV), 3 luật dừng và ngày quyết định 2027-01-05 được chốt và lưu phiên bản trước ngày khởi chạy pilot"
  stop_rules:
    - "NẾU phát sinh >= 1 ca hoàn tiền trùng hoặc thông báo đã hoàn không có bản ghi sổ cái ok cùng trace_id TRONG bất kỳ kỳ đối soát theo giờ nào THÌ Giám đốc vận hành LogiX-VN kích hoạt cờ tắt trợ lý trong vòng 30 phút và Kỹ sư trưởng agent rà trace + khoá chống trùng KHÔNG THÌ không được bật lại trợ lý hoặc mở sang bước rollout tiếp theo"
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần 6% TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN kích hoạt cờ tắt trợ lý trong vòng 30 phút và Kỹ sư trưởng agent rà trace lỗi KHÔNG THÌ không được mở sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công đo bằng phút thực tế vượt 8.000 đ (hoặc tỉ lệ làm lại > 7%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở lại hang_nang hoặc tăng tỉ lệ rollout"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sua + bo) vượt 40% hoặc tỉ lệ xem lại vẫn > 50% ở cuối bước 0.25 TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên trong 3 ngày để sửa quy trình và giao diện gợi ý KHÔNG THÌ không được chuyển sang bước rollout 0.50"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
